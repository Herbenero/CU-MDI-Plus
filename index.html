<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hellcastle Dart Night</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --primary: #2196f3;
      --accent: #ff9800;
      --danger: #f44336;
      --success: #4caf50;
      --text: #ffffff;
      --subtext: #aaaaaa;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    h1, h2, h3 { text-align: center; margin-top: 0; }
    .header { text-align: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px; }
    .sync-box {
      background: #2a2a2a;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 0.85em;
    }
    .flex-row { display: flex; gap: 8px; margin-bottom: 10px; }
    input[type="text"] {
      flex: 1;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #2b2b2b;
      color: #fff;
    }
    button {
      padding: 10px 14px;
      border: none;
      border-radius: 6px;
      background: var(--primary);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    button.secondary { background: #444; }
    button.success { background: var(--success); }
    button.danger { background: var(--danger); }
    button.accent { background: var(--accent); color: #000; }
    .player-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }
    .player-card {
      background: #2a2a2a;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      border: 2px solid transparent;
    }
    .player-card.active { border-color: var(--success); background: #1e3323; }
    .player-card .name { font-weight: bold; }
    .player-card .score { font-size: 1.4em; color: var(--accent); }
    .player-card .sub { font-size: 0.8em; color: var(--subtext); }
    
    .keypad {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 15px;
    }
    .keypad button {
      padding: 12px 0;
      background: #333;
      font-size: 0.9em;
    }
    .multiplier-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }
    .multiplier-row button.selected { outline: 2px solid #fff; }
    
    .board-info {
      text-align: center;
      background: #252525;
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 10px;
    }
    .dart-slots {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 8px 0;
      font-weight: bold;
    }
    .dart-slot {
      background: #333;
      padding: 4px 12px;
      border-radius: 4px;
      min-width: 25px;
    }
    
    table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #333; }
    th { background: #252525; }
    
    .screen { display: none; }
    .screen.active { display: block; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Hellcastle Dart Night</h1>
    <div class="sync-box">
      <div id="peer-status">Multi-Device Status: Initializing...</div>
      <div class="flex-row" style="margin-top:5px; margin-bottom:0;">
        <input type="text" id="join-id-input" placeholder="Enter Host Peer ID">
        <button onclick="connectToHost()" class="secondary">Connect</button>
      </div>
    </div>
  </div>

  <!-- SETUP SCREEN -->
  <div id="screen-setup" class="screen active">
    <h2>Player Setup</h2>
    <div class="flex-row">
      <input type="text" id="player-name-input" placeholder="Player Name">
      <button onclick="addPlayer()">Add Player</button>
    </div>
    <div id="setup-player-list" style="margin-bottom:15px;"></div>
    <button onclick="startGameSequence()" class="success" style="width:100%; font-size:1.1em;">Start Countup (Game 1)</button>
  </div>

  <!-- GAMEPLAY SCREEN -->
  <div id="screen-game" class="screen">
    <h2 id="game-title">Countup</h2>
    <div class="player-list" id="game-player-cards"></div>
    
    <div class="board-info">
      <div>Current Turn: <b id="current-player-display">-</b> | <span id="round-display">Round 1</span></div>
      <div class="dart-slots">
        <span class="dart-slot" id="dart-0">-</span>
        <span class="dart-slot" id="dart-1">-</span>
        <span class="dart-slot" id="dart-2">-</span>
      </div>
      <div id="robin-target-display" style="display:none; color:var(--accent); font-weight:bold;">Target: -</div>
    </div>

    <div class="multiplier-row">
      <button id="mult-1" class="selected" onclick="setMultiplier(1)">SINGLE (1x)</button>
      <button id="mult-2" onclick="setMultiplier(2)">DOUBLE (2x)</button>
      <button id="mult-3" onclick="setMultiplier(3)">TRIPLE (3x)</button>
    </div>

    <div class="keypad" id="standard-keypad">
      <!-- 1 to 20 dynamically added -->
    </div>

    <div class="flex-row">
      <button onclick="recordDart(25)" style="flex:1; background:#0288d1;">25 Outer</button>
      <button onclick="recordDart(50)" style="flex:1; background:#388e3c;">50 Bull</button>
      <button onclick="recordDart(0)" style="flex:1; background:#616161;">MISS</button>
    </div>

    <div class="flex-row" style="margin-top:10px;">
      <button onclick="undoDart()" class="secondary" style="flex:1;">↩ Undo</button>
      <button onclick="submitTurn()" class="success" style="flex:2;">Submit Turn ➔</button>
    </div>
  </div>

  <!-- SCOREBOARD SCREEN -->
  <div id="screen-scoreboard" class="screen">
    <h2>Game Finished!</h2>
    <h3 id="scoreboard-game-name">Countup Results</h3>
    <table id="scoreboard-table">
      <thead>
        <tr><th>Rank</th><th>Player</th><th>Score</th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <button onclick="showLeaderboardScreen()" class="accent" style="width:100%; font-size:1.1em;">Leaderboard ➔</button>
  </div>

  <!-- LEADERBOARD SCREEN -->
  <div id="screen-leaderboard" class="screen">
    <h2>Overall Leaderboard</h2>
    <table>
      <thead>
        <tr><th>Rank</th><th>Player</th><th>Match Points</th></tr>
      </thead>
      <tbody id="leaderboard-tbody"></tbody>
    </table>
    <button onclick="startNextEvent()" class="success" style="width:100%; font-size:1.1em;">Next Event: Robin Hood ➔</button>
  </div>
</div>

<script>
  // --- MATCH POINT SCALE ---
  const MATCH_POINTS_SCALE = [25, 20, 15, 10, 8, 6, 4, 3, 2, 1];

  // --- STATE ---
  let state = {
    screen: 'setup',
    currentGame: 'countup', // 'countup' or 'robinhood'
    players: [], // { name, countupScore, robinLives, totalMatchPoints }
    currentPlayerIdx: 0,
    currentRound: 1,
    maxRounds: 8,
    turnDarts: [],
    multiplier: 1,
    robinTargets: {} // player Name -> target number
  };

  // --- PEER JS MULTI-DEVICE ---
  let peer = null;
  let connections = [];
  let hostConn = null;
  let isHost = true;

  function initPeer() {
    peer = new Peer();
    peer.on('open', id => {
      document.getElementById('peer-status').innerHTML = `Host ID: <b>${id}</b>`;
    });
    peer.on('connection', conn => {
      connections.push(conn);
      conn.on('data', data => handleNetworkData(data));
      conn.on('open', () => conn.send({ type: 'STATE_UPDATE', state }));
    });
  }

  function connectToHost() {
    const hostId = document.getElementById('join-id-input').value.trim();
    if(!hostId) return;
    hostConn = peer.connect(hostId);
    isHost = false;
    hostConn.on('open', () => {
      document.getElementById('peer-status').innerHTML = `Connected to Host`;
    });
    hostConn.on('data', data => handleNetworkData(data));
  }

  function broadcastState() {
    if (isHost) {
      connections.forEach(c => c.open && c.send({ type: 'STATE_UPDATE', state }));
      render();
    } else if (hostConn && hostConn.open) {
      hostConn.send({ type: 'CLIENT_ACTION', state });
    }
  }

  function handleNetworkData(data) {
    if (data.type === 'STATE_UPDATE') {
      state = data.state;
      render();
    } else if (data.type === 'CLIENT_ACTION' && isHost) {
      state = data.state;
      broadcastState();
    }
  }

  // --- GAME LOGIC ---
  function addPlayer() {
    const input = document.getElementById('player-name-input');
    const name = input.value.trim();
    if (!name) return;
    state.players.push({
      name: name,
      countupScore: 0,
      robinLives: 3,
      totalMatchPoints: 0
    });
    input.value = '';
    broadcastState();
  }

  function startGameSequence() {
    if (state.players.length === 0) return alert("Add at least one player!");
    state.screen = 'game';
    state.currentGame = 'countup';
    state.currentRound = 1;
    state.currentPlayerIdx = 0;
    state.turnDarts = [];
    state.players.forEach(p => p.countupScore = 0);
    broadcastState();
  }

  function setMultiplier(m) {
    state.multiplier = m;
    document.querySelectorAll('.multiplier-row button').forEach((b, i) => {
      b.classList.toggle('selected', i + 1 === m);
    });
  }

  function recordDart(val) {
    if (state.turnDarts.length >= 3) return;
    let score = val * (val === 25 || val === 50 ? 1 : state.multiplier);
    state.turnDarts.push({ base: val, mult: state.multiplier, total: score });
    state.multiplier = 1;
    setMultiplier(1);
    broadcastState();
  }

  function undoDart() {
    state.turnDarts.pop();
    broadcastState();
  }

  function submitTurn() {
    const player = state.players[state.currentPlayerIdx];
    
    if (state.currentGame === 'countup') {
      let turnTotal = state.turnDarts.reduce((a, b) => a + b.total, 0);
      player.countupScore += turnTotal;
    } else if (state.currentGame === 'robinhood') {
      // Robin Hood logic: Hitting target subtracts lives from opponents or hits target
      let target = state.robinTargets[player.name];
      state.turnDarts.forEach(d => {
        if (d.base === target) {
          // Hit target: apply hit action
          let nextIdx = (state.currentPlayerIdx + 1) % state.players.length;
          if (state.players[nextIdx].robinLives > 0) {
            state.players[nextIdx].robinLives -= 1;
          }
        }
      });
    }

    state.turnDarts = [];
    state.currentPlayerIdx++;

    if (state.currentPlayerIdx >= state.players.length) {
      state.currentPlayerIdx = 0;
      state.currentRound++;
    }

    // Check game end conditions
    if (state.currentGame === 'countup' && state.currentRound > state.maxRounds) {
      calculateMatchPoints('countup');
      state.screen = 'scoreboard';
    } else if (state.currentGame === 'robinhood') {
      let active = state.players.filter(p => p.robinLives > 0);
      if (active.length <= 1 || state.currentRound > 10) {
        calculateMatchPoints('robinhood');
        state.screen = 'scoreboard';
      }
    }

    broadcastState();
  }

  function calculateMatchPoints(gameType) {
    let sorted = [...state.players];
    if (gameType === 'countup') {
      sorted.sort((a, b) => b.countupScore - a.countupScore);
    } else {
      sorted.sort((a, b) => b.robinLives - a.robinLives);
    }

    sorted.forEach((p, idx) => {
      let pts = idx < MATCH_POINTS_SCALE.length ? MATCH_POINTS_SCALE[idx] : 1;
      let targetPlayer = state.players.find(original => original.name === p.name);
      targetPlayer.totalMatchPoints += pts;
    });
  }

  function showLeaderboardScreen() {
    state.screen = 'leaderboard';
    broadcastState();
  }

  function startNextEvent() {
    state.currentGame = 'robinhood';
    state.screen = 'game';
    state.currentRound = 1;
    state.currentPlayerIdx = 0;
    state.turnDarts = [];
    
    // Assign targets 15..20 to players for Robin Hood
    state.players.forEach((p, i) => {
      p.robinLives = 3;
      state.robinTargets[p.name] = 15 + (i % 6);
    });

    broadcastState();
  }

  // --- UI RENDER ENGINE ---
  function render() {
    // Show active screen
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(`screen-${state.screen}`).classList.add('active');

    // Setup screen
    if (state.screen === 'setup') {
      document.getElementById('setup-player-list').innerHTML = state.players
        .map(p => `<div style="padding:6px; background:#2a2a2a; margin-bottom:4px; border-radius:4px;">${p.name}</div>`).join('');
    }

    // Game screen
    if (state.screen === 'game') {
      document.getElementById('game-title').innerText = state.currentGame === 'countup' ? 'Countup' : 'Robin Hood';
      
      const pCards = document.getElementById('game-player-cards');
      pCards.innerHTML = state.players.map((p, i) => `
        <div class="player-card ${i === state.currentPlayerIdx ? 'active' : ''}">
          <div class="name">${p.name}</div>
          <div class="score">${state.currentGame === 'countup' ? p.countupScore : p.robinLives + ' ♥'}</div>
          <div class="sub">${state.currentGame === 'robinhood' ? 'Target: ' + state.robinTargets[p.name] : 'Pts'}</div>
        </div>
      `).join('');

      document.getElementById('current-player-display').innerText = state.players[state.currentPlayerIdx]?.name || '-';
      document.getElementById('round-display').innerText = `Round ${state.currentRound} / ${state.currentGame === 'countup' ? state.maxRounds : 10}`;

      // Robin Hood specific target display
      const targetDisp = document.getElementById('robin-target-display');
      if (state.currentGame === 'robinhood') {
        targetDisp.style.display = 'block';
        targetDisp.innerText = `Your Target: ${state.robinTargets[state.players[state.currentPlayerIdx]?.name]}`;
      } else {
        targetDisp.style.display = 'none';
      }

      // Render dart inputs
      for (let i = 0; i < 3; i++) {
        let d = state.turnDarts[i];
        document.getElementById(`dart-${i}`).innerText = d ? `${d.mult > 1 ? d.mult + 'x' : ''}${d.base}` : '-';
      }
    }

    // Scoreboard screen
    if (state.screen === 'scoreboard') {
      document.getElementById('scoreboard-game-name').innerText = state.currentGame === 'countup' ? 'Countup Game Over' : 'Robin Hood Game Over';
      let sorted = [...state.players];
      if (state.currentGame === 'countup') {
        sorted.sort((a, b) => b.countupScore - a.countupScore);
      } else {
        sorted.sort((a, b) => b.robinLives - a.robinLives);
      }
      
      const tbody = document.querySelector('#scoreboard-table tbody');
      tbody.innerHTML = sorted.map((p, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${p.name}</td>
          <td>${state.currentGame === 'countup' ? p.countupScore : p.robinLives + ' Lives left'}</td>
        </tr>
      `).join('');
    }

    // Leaderboard screen
    if (state.screen === 'leaderboard') {
      let sorted = [...state.players].sort((a, b) => b.totalMatchPoints - a.totalMatchPoints);
      document.getElementById('leaderboard-tbody').innerHTML = sorted.map((p, i) => `
        <tr>
          <td><b>${i + 1}</b></td>
          <td>${p.name}</td>
          <td><b>${p.totalMatchPoints} pts</b></td>
        </tr>
      `).join('');
    }
  }

  // Init Keypad buttons 1..20
  const keypad = document.getElementById('standard-keypad');
  for (let i = 1; i <= 20; i++) {
    let btn = document.createElement('button');
    btn.innerText = i;
    btn.onclick = () => recordDart(i);
    keypad.appendChild(btn);
  }

  initPeer();
  render();
</script>
</body>
</html>
