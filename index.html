<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hellcastle Dart Night</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #121212;
      color: #fff;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
      background: #1e1e1e;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      position: relative;
    }
    .setup-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 15px;
    }
    .btn-add-player {
      background: #0288d1;
      color: white;
      font-weight: bold;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-add-player:hover { background: #039be5; }
    .status-box {
      display: flex;
      justify-content: center;
      font-size: 1.1rem;
      margin-bottom: 20px;
      background: #2a2a2a;
      padding: 10px;
      border-radius: 6px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .player-card {
      flex: 1;
      min-width: 140px;
      padding: 10px;
      border-radius: 6px;
      border: 2px solid #444;
      background: #181818;
    }
    .active-player {
      border-color: #00e676;
      background: #1e3323;
    }
    .player-name-input {
      background: transparent;
      border: none;
      border-bottom: 1px dashed #666;
      color: #fff;
      font-size: 1.1rem;
      font-weight: bold;
      text-align: center;
      width: 90%;
      margin-bottom: 8px;
    }
    .player-name-input:focus {
      border-bottom-color: #00e676;
      outline: none;
    }
    .turn-summary {
      background: #262626;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 15px;
    }
    .dart-list {
      font-size: 1.3rem;
      font-weight: bold;
      color: #00e676;
      letter-spacing: 2px;
    }
    .modifier-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }
    .btn-mod {
      background: #333;
      color: #fff;
      border: 2px solid #555;
      padding: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-mod.selected {
      background: #ff9800;
      color: #000;
      border-color: #ffb74d;
    }
    .board-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 15px;
    }
    button {
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      padding: 12px;
      font-size: 1.1rem;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #3d3d3d; }
    button:active { background: #555; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .action-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 10px;
    }
    .btn-action { background: #d32f2f; font-weight: bold; }
    .btn-action:hover { background: #f44336; }
    .btn-undo { background: #f57c00; font-weight: bold; }
    .btn-undo:hover { background: #ff9800; }
    .btn-submit {
      background: #2e7d32;
      font-weight: bold;
      grid-column: span 2;
      padding: 15px;
      font-size: 1.2rem;
    }
    .btn-submit:hover { background: #388e3c; }

    /* Modal Styles */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.88);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-overlay.visible { display: flex; }
    .modal-card {
      background: #1e1e1e;
      border: 2px solid #00e676;
      border-radius: 12px;
      padding: 25px;
      width: 90%;
      max-width: 480px;
      box-shadow: 0 0 20px rgba(0,230,118,0.3);
    }
    .modal-table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
      font-size: 1.1rem;
    }
    .modal-table th, .modal-table td {
      padding: 10px;
      border-bottom: 1px solid #333;
      text-align: left;
    }
    .modal-table th { color: #888; text-transform: uppercase; font-size: 0.85rem; }
    .btn-primary-action {
      background: #00e676;
      color: #000;
      font-size: 1.2rem;
      font-weight: bold;
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }
    .btn-primary-action:hover { background: #66ffa6; }
    .btn-next-event {
      background: #ff9800;
      color: #000;
      font-size: 1.2rem;
      font-weight: bold;
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }
    .btn-next-event:hover { background: #ffb74d; }
  </style>
</head>
<body>
  <div class="container">
    <h2 id="app-heading">Hellcastle Dart Night</h2>
    <h3 id="game-subtitle" style="color: #00e676; margin-top:-10px;">Game 1: Countup</h3>

    <div class="setup-bar">
      <button id="btn-add-player" class="btn-add-player">+ Add Player</button>
    </div>

    <!-- Dynamic Players Display -->
    <div class="status-box" id="players-container"></div>

    <!-- Active Turn State -->
    <div class="turn-summary">
      <p style="margin:0 0 5px 0;">
        Current Turn: <strong><span id="current-player-display">Player 1</span></strong> | 
        Round: <span id="current-round-display">1</span> / <span id="total-rounds-display">8</span>
      </p>
      <div>Darts Thrown: <span class="dart-list" id="darts-display">[-] [-] [-]</span></div>
    </div>

    <!-- Multipliers -->
    <div class="modifier-grid">
      <button class="btn-mod selected" id="mod-single" data-mult="1">SINGLE (1x)</button>
      <button class="btn-mod" id="mod-double" data-mult="2">DOUBLE (2x)</button>
      <button class="btn-mod" id="mod-triple" data-mult="3">TRIPLE (3x)</button>
    </div>

    <!-- Dart Board Inputs -->
    <div class="board-grid" id="number-board">
      <script>
        for (let i = 1; i <= 20; i++) {
          document.write(`<button class="btn-num" data-base="${i}">${i}</button>`);
        }
      </script>
      <button class="btn-num" data-base="25" style="grid-column: span 2; background: #1565c0;">25 (Outer Bull)</button>
      <button class="btn-num" data-base="50" style="grid-column: span 2; background: #2e7d32;">50 (Bullseye)</button>
      <button class="btn-num" data-base="0" style="grid-column: span 1; background: #424242;">MISS</button>
    </div>

    <!-- Controls -->
    <div class="action-grid">
      <button id="btn-undo" class="btn-undo">↩ Undo Dart</button>
      <button id="btn-reset" class="btn-action">Reset Game</button>
      <button id="btn-submit-turn" class="btn-submit">Submit Turn ➔</button>
    </div>
  </div>

  <!-- Final Scoreboard Overlay Modal -->
  <div class="modal-overlay" id="scoreboard-modal">
    <div class="modal-card">
      <h2 style="margin-top:0; color: #00e676;">🏆 Countup Finished 🏆</h2>
      <p style="color: #aaa; margin-bottom: 10px;">Final Game Scoreboard</p>
      <table class="modal-table">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Player</th>
            <th style="text-align: right;">Countup Score</th>
          </tr>
        </thead>
        <tbody id="scoreboard-body"></tbody>
      </table>
      <button id="btn-show-leaderboard" class="btn-primary-action">Leaderboard ➔</button>
    </div>
  </div>

  <!-- Overall Match Points Leaderboard Overlay Modal -->
  <div class="modal-overlay" id="leaderboard-modal">
    <div class="modal-card" style="border-color: #ff9800; box-shadow: 0 0 20px rgba(255,152,0,0.3);">
      <h2 style="margin-top:0; color: #ff9800;">⭐ Overall Leaderboard ⭐</h2>
      <p style="color: #aaa; margin-bottom: 10px;">Event Standings & Match Points</p>
      <table class="modal-table">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Player</th>
            <th style="text-align: right;">Total Points</th>
          </tr>
        </thead>
        <tbody id="leaderboard-body"></tbody>
      </table>
      <button id="btn-next-event" class="btn-next-event">Next Event ➔</button>
    </div>
  </div>

  <!-- Firebase Modular SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { databaseURL: "https://countupmultivice-default-rtdb.firebaseio.com" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const roomId = "9597";
    const gameStateRef = ref(db, `${roomId}/state`);
    
    const TOTAL_ROUNDS = 8;
    const POINTS_SCALE = [25, 20, 15, 10, 8, 6, 4, 3, 2, 1];

    // UI elements
    const playersContainer = document.getElementById("players-container");
    const currentPlayerDisplay = document.getElementById("current-player-display");
    const currentRoundDisplay = document.getElementById("current-round-display");
    const dartsDisplay = document.getElementById("darts-display");
    const modSingle = document.getElementById("mod-single");
    const btnAddPlayer = document.getElementById("btn-add-player");
    
    const scoreboardModal = document.getElementById("scoreboard-modal");
    const scoreboardBody = document.getElementById("scoreboard-body");
    const leaderboardModal = document.getElementById("leaderboard-modal");
    const leaderboardBody = document.getElementById("leaderboard-body");

    let localState = {};
    let currentMultiplier = 1;

    // Listen to Firebase Realtime DB Updates
    onValue(gameStateRef, (snapshot) => {
      const state = snapshot.val();
      if (!state) {
        initGameState();
        return;
      }
      localState = state;
      renderUI(state);
    });

    function initGameState() {
      set(gameStateRef, {
        gameMode: "countup",
        playerCount: 2,
        currentPlayer: 1,
        currentRound: 1,
        playerNames: { "1": "Player 1", "2": "Player 2" },
        dartScores: { "1": 0, "2": 0 },
        matchPoints: { "1": 0, "2": 0 },
        currentTurnDarts: [],
        gameOver: false,
        showLeaderboard: false
      });
    }

    function renderUI(state) {
      const totalPlayers = state.playerCount || 2;
      const activeP = state.currentPlayer || 1;
      const scores = state.dartScores || {};
      const names = state.playerNames || {};
      const currentDarts = state.currentTurnDarts || [];
      const isGameOver = !!state.gameOver;
      const isShowLeaderboard = !!state.showLeaderboard;
      const currentGame = state.gameMode || "countup";

      // Subtitle update
      document.getElementById("game-subtitle").textContent = currentGame === "countup" ? "Game 1: Countup" : "Game 2: Robin Hood";

      // Modals control
      if (isGameOver && !isShowLeaderboard) {
        renderScoreboard(totalPlayers, names, scores);
        scoreboardModal.classList.add("visible");
        leaderboardModal.classList.remove("visible");
      } else if (isGameOver && isShowLeaderboard) {
        renderLeaderboard(totalPlayers, names, state.matchPoints || {});
        scoreboardModal.classList.remove("visible");
        leaderboardModal.classList.add("visible");
      } else {
        scoreboardModal.classList.remove("visible");
        leaderboardModal.classList.remove("visible");
      }

      // Input buttons state
      document.querySelectorAll(".btn-num, .btn-mod, #btn-undo, #btn-submit-turn, #btn-add-player").forEach(btn => {
        btn.disabled = isGameOver;
      });

      // Player cards rendering
      playersContainer.innerHTML = "";
      for (let p = 1; p <= totalPlayers; p++) {
        const pName = names[p] || `Player ${p}`;
        const card = document.createElement("div");
        card.className = `player-card ${p === activeP && !isGameOver ? 'active-player' : ''}`;
        card.innerHTML = `
          <input type="text" class="player-name-input" data-player="${p}" value="${pName}" ${isGameOver ? 'disabled' : ''} />
          <p style="margin:0;">Score: <strong>${scores[p] || 0}</strong></p>
        `;
        playersContainer.appendChild(card);
      }

      // Name Inputs
      document.querySelectorAll(".player-name-input").forEach(input => {
        input.addEventListener("change", (e) => {
          const pId = e.target.dataset.player;
          const newName = e.target.value.trim() || `Player ${pId}`;
          update(gameStateRef, { [`playerNames/${pId}`]: newName });
        });
      });

      const activeName = names[activeP] || `Player ${activeP}`;
      currentPlayerDisplay.textContent = isGameOver ? "Game Over" : activeName;
      currentRoundDisplay.textContent = Math.min(state.currentRound || 1, TOTAL_ROUNDS);

      // Dart display string
      let dartsFormatted = [];
      for (let i = 0; i < 3; i++) {
        if (currentDarts[i] !== undefined) {
          dartsFormatted.push(`[${currentDarts[i].label}]`);
        } else {
          dartsFormatted.push(`[-]`);
        }
      }
      dartsDisplay.textContent = dartsFormatted.join(" ");
    }

    function getStandings(totalPlayers, names, scores) {
      let standings = [];
      for (let p = 1; p <= totalPlayers; p++) {
        standings.push({ id: p, name: names[p] || `Player ${p}`, score: scores[p] || 0 });
      }
      standings.sort((a, b) => b.score - a.score);
      return standings;
    }

    function renderScoreboard(totalPlayers, names, scores) {
      const standings = getStandings(totalPlayers, names, scores);
      scoreboardBody.innerHTML = "";
      standings.forEach((player, index) => {
        const tr = document.createElement("tr");
        let rankBadge = `${index + 1}`;
        if (index === 0) rankBadge = "🥇 1st";
        else if (index === 1) rankBadge = "🥈 2nd";
        else if (index === 2) rankBadge = "🥉 3rd";

        tr.innerHTML = `
          <td>${rankBadge}</td>
          <td>${player.name}</td>
          <td style="text-align: right; font-weight: bold;">${player.score}</td>
        `;
        scoreboardBody.appendChild(tr);
      });
    }

    function renderLeaderboard(totalPlayers, names, matchPoints) {
      let standings = [];
      for (let p = 1; p <= totalPlayers; p++) {
        standings.push({ id: p, name: names[p] || `Player ${p}`, pts: matchPoints[p] || 0 });
      }
      standings.sort((a, b) => b.pts - a.pts);

      leaderboardBody.innerHTML = "";
      standings.forEach((player, index) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><b>#${index + 1}</b></td>
          <td>${player.name}</td>
          <td style="text-align: right; font-weight: bold; color:#00e676;">${player.pts} pts</td>
        `;
        leaderboardBody.appendChild(tr);
      });
    }

    // Leaderboard button listener
    document.getElementById("btn-show-leaderboard").addEventListener("click", () => {
      // Guard against multiple additions if leaderboard is already showing
      if (localState.showLeaderboard) return;

      const totalPlayers = localState.playerCount || 2;
      const names = localState.playerNames || {};
      const scores = localState.dartScores || {};
      const standings = getStandings(totalPlayers, names, scores);
      
      let updatedMatchPoints = { ...(localState.matchPoints || {}) };
      standings.forEach((player, index) => {
        const ptsEarned = index < POINTS_SCALE.length ? POINTS_SCALE[index] : 1;
        updatedMatchPoints[player.id] = (updatedMatchPoints[player.id] || 0) + ptsEarned;
      });

      update(gameStateRef, {
        matchPoints: updatedMatchPoints,
        showLeaderboard: true
      });
    });

    // Next Event button listener
    document.getElementById("btn-next-event").addEventListener("click", () => {
      let resetScores = {};
      const total = localState.playerCount || 2;
      for (let i = 1; i <= total; i++) resetScores[i] = 0;

      update(gameStateRef, {
        gameMode: "robinhood",
        currentPlayer: 1,
        currentRound: 1,
        dartScores: resetScores,
        currentTurnDarts: [],
        gameOver: false,
        showLeaderboard: false
      });
    });

    // Add Player Button
    btnAddPlayer.addEventListener("click", () => {
      const currentCount = localState.playerCount || 2;
      const newCount = currentCount + 1;
      update(gameStateRef, {
        playerCount: newCount,
        [`playerNames/${newCount}`]: `Player ${newCount}`,
        [`dartScores/${newCount}`]: 0,
        [`matchPoints/${newCount}`]: 0
      });
    });

    // Multipliers
    document.querySelectorAll(".btn-mod").forEach(btn => {
      btn.addEventListener("click", (e) => {
        document.querySelectorAll(".btn-mod").forEach(b => b.classList.remove("selected"));
        e.target.classList.add("selected");
        currentMultiplier = parseInt(e.target.dataset.mult);
      });
    });

    function resetMultiplier() {
      currentMultiplier = 1;
      document.querySelectorAll(".btn-mod").forEach(b => b.classList.remove("selected"));
      modSingle.classList.add("selected");
    }

    // Dart Inputs
    document.getElementById("number-board").addEventListener("click", (e) => {
      if (localState.gameOver) return;
      const baseValue = parseInt(e.target.dataset.base);
      if (isNaN(baseValue)) return;

      const currentDarts = localState.currentTurnDarts || [];
      if (currentDarts.length >= 3) {
        alert("3 darts already thrown! Press 'Submit Turn' to proceed.");
        return;
      }

      let points = 0;
      let label = "";

      if (baseValue === 0) {
        label = "MISS";
        points = 0;
      } else if (baseValue === 50) {
        label = "BULL";
        points = 50;
      } else if (baseValue === 25) {
        label = currentMultiplier === 2 ? "BULL" : "25";
        points = currentMultiplier === 2 ? 50 : 25;
      } else {
        points = baseValue * currentMultiplier;
        const prefix = currentMultiplier === 3 ? "T" : (currentMultiplier === 2 ? "D" : "");
        label = `${prefix}${baseValue}`;
      }

      const activePlayer = localState.currentPlayer || 1;
      const currentScores = localState.dartScores || {};
      const newScore = (currentScores[activePlayer] || 0) + points;
      const updatedDarts = [...currentDarts, { points, label }];

      update(gameStateRef, {
        [`dartScores/${activePlayer}`]: newScore,
        currentTurnDarts: updatedDarts
      });

      resetMultiplier();
    });

    // Undo
    document.getElementById("btn-undo").addEventListener("click", () => {
      if (localState.gameOver) return;
      const currentDarts = localState.currentTurnDarts || [];
      if (currentDarts.length === 0) return;

      const lastDart = currentDarts.pop();
      const activePlayer = localState.currentPlayer || 1;
      const currentScores = localState.dartScores || {};
      const updatedScore = Math.max(0, (currentScores[activePlayer] || 0) - lastDart.points);

      update(gameStateRef, {
        [`dartScores/${activePlayer}`]: updatedScore,
        currentTurnDarts: currentDarts
      });
    });

    // Submit Turn
    document.getElementById("btn-submit-turn").addEventListener("click", () => {
      if (localState.gameOver) return;

      const activePlayer = localState.currentPlayer || 1;
      const totalPlayers = localState.playerCount || 2;
      const currentRound = localState.currentRound || 1;

      let nextPlayer = activePlayer + 1;
      let nextRound = currentRound;
      let isGameOver = false;

      if (nextPlayer > totalPlayers) {
        nextPlayer = 1;
        nextRound += 1;
      }

      if (nextRound > TOTAL_ROUNDS) {
        isGameOver = true;
      }

      update(gameStateRef, {
        currentPlayer: nextPlayer,
        currentRound: nextRound,
        currentTurnDarts: [],
        gameOver: isGameOver
      });
    });

    // Reset Game
    document.getElementById("btn-reset").addEventListener("click", () => {
      if (confirm("Reset current game scores?")) {
        initGameState();
      }
    });
  </script>
</body>
</html>
